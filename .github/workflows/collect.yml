name: collect rates

# 定期収集は Vercel Cron（vercel.json）に移した。
# GitHub Actions のスケジュールは実際に発火せず（2026-09-06 に3回連続で不発）、
# 予備の手動実行だけを残している。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 収集
        run: node scripts/collect.mjs
      - name: コミット
        run: |
          git config user.name  "hanbaijo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet && echo "変更なし" && exit 0
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push
